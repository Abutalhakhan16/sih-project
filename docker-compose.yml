services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: coopserve
      POSTGRES_USER: coopserve
      POSTGRES_PASSWORD: coopserve
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: ./backend
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload
    working_dir: /workspace
    volumes: [".:/workspace"]
    environment:
      DATABASE_URL: postgresql+asyncpg://coopserve:coopserve@db:5432/coopserve
      DATABASE_URL_SYNC: postgresql://coopserve:coopserve@db:5432/coopserve
      APP_ENV: development
    ports: ["8000:8000"]
    depends_on: [db, redis]
volumes:
  postgres_data:
